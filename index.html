<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b16">
  <meta name="description" content="A small signal from pascariu.eu.">
  <title>pascariu.eu</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f5f0;
      --muted: #9ba5b8;
      --violet: #b9a4ff;
      --cyan: #8de8df;
      --night: #080b16;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100svh;
      overflow: hidden;
      place-items: center;
      background:
        radial-gradient(circle at 50% 46%, rgba(72, 51, 129, 0.32), transparent 32rem),
        radial-gradient(circle at 18% 18%, rgba(41, 130, 145, 0.16), transparent 20rem),
        var(--night);
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
    }

    body::before,
    body::after {
      position: fixed;
      inset: 0;
      z-index: -1;
      content: '';
      pointer-events: none;
    }

    body::before {
      opacity: 0.72;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.9) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(141, 232, 223, 0.7) 0 1px, transparent 1.5px);
      background-position: 9% 22%, 71% 66%;
      background-size: 173px 191px, 227px 213px;
    }

    body::after {
      background: linear-gradient(115deg, transparent 46%, rgba(185, 164, 255, 0.05) 50%, transparent 54%);
      transform: rotate(-8deg) scale(1.4);
    }

    main {
      width: min(100% - 3rem, 58rem);
      padding: 2rem 0;
      text-align: center;
      animation: arrive 1.1s ease-out both;
    }

    .signal {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 2.4rem;
      color: var(--muted);
      font-family: 'Courier New', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .signal::before {
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 1rem var(--cyan);
      content: '';
    }

    h1 {
      max-width: 11ch;
      margin: 0 auto;
      color: var(--ink);
      font-size: clamp(3.8rem, 12vw, 8.6rem);
      font-weight: 400;
      letter-spacing: -0.04em;
      line-height: 0.9;
      text-wrap: balance;
      text-shadow: 0 0 2.5rem rgba(185, 164, 255, 0.2);
    }

    h1 em {
      color: var(--violet);
      font-style: normal;
    }

    .orbit {
      width: min(80vw, 28rem);
      height: 4rem;
      margin: 2.8rem auto 2.2rem;
      border-top: 1px solid rgba(141, 232, 223, 0.38);
      border-radius: 50%;
      transform: rotate(-7deg);
      box-shadow: 0 -0.8rem 1.8rem rgba(141, 232, 223, 0.08);
    }

    .orbit::after {
      display: block;
      width: 0.65rem;
      height: 0.65rem;
      margin: -0.35rem 0 0 23%;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 1.5rem 0.3rem rgba(141, 232, 223, 0.35);
      content: '';
    }

    p {
      margin: 0;
      color: var(--muted);
      font-family: 'Courier New', monospace;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
    }

    @keyframes arrive {
      from {
        opacity: 0;
        transform: translateY(1rem);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      main {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="signal">Signal received</div>
    <h1>Greetings, <em>human</em></h1>
    <div class="orbit" aria-hidden="true"></div>
    <p>pascariu.eu // transmission open</p>
  </main>
</body>
</html>
